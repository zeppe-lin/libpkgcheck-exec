name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC shared, cc: gcc, cxx: g++, mode: shared, buildtype: debug}
          - {name: GCC static, cc: gcc, cxx: g++, mode: static, buildtype: debug}
          - {name: Clang shared, cc: clang, cxx: clang++, mode: shared, buildtype: debug}
          - {name: Clang static, cc: clang, cxx: clang++, mode: static, buildtype: debug}
          - {name: GCC release, cc: gcc, cxx: g++, mode: shared, buildtype: release}
    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgsource, ref: 9a2a85c85c20bbfa77306f3eb14ccc67ac1e800c, path: dependencies/libpkgsource}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgcatalog, ref: 16976cac176f576871e327d5d2f6fe9d9dfa0666, path: dependencies/libpkgcatalog}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgstate, ref: f74df278b47b48e798c3de01c922c59b58319d13, path: dependencies/libpkgstate}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgresolve, ref: master, path: dependencies/libpkgresolve}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild, ref: master, path: dependencies/libpkgbuild}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgtransaction, ref: master, path: dependencies/libpkgtransaction}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgcheck, ref: v0.2.0, path: dependencies/libpkgcheck}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgexec, ref: 08814baf2dbc037a037f29dd7de218e5a19c7e77, path: dependencies/libpkgexec}}
      - name: Verify qualified authority trees
        run: |
          test "$(git -C dependencies/libpkgresolve rev-parse 'HEAD^{tree}')" = 9e030b49606d5ac78bb1ee0c868681a37d0726cc
          test "$(git -C dependencies/libpkgbuild rev-parse 'HEAD^{tree}')" = 91b5326081cb5485ecaa3bcfb48829d34e653f10
          test "$(git -C dependencies/libpkgtransaction rev-parse 'HEAD^{tree}')" = 32f84467066fd2a6117c70b4907c67fbc04c6988
          test "$(git -C dependencies/libpkgcheck rev-parse 'HEAD^{tree}')" = da15d6d025f074ecc5ce14bdda228a3d32e0f49a
          test "$(git -C dependencies/libpkgexec rev-parse 'HEAD^{tree}')" = 2a896dcd02ba8d1860eda29a1673ef03b0f2290f
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libssl-dev ninja-build pkg-config python3-venv scdoc
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.11.1'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: Configure, build, test, and consume installed product
        env: &authority
          LIBPKGSOURCE_SOURCE: dependencies/libpkgsource
          LIBPKGCATALOG_SOURCE: dependencies/libpkgcatalog
          LIBPKGSTATE_SOURCE: dependencies/libpkgstate
          LIBPKGRESOLVE_SOURCE: dependencies/libpkgresolve
          LIBPKGBUILD_SOURCE: dependencies/libpkgbuild
          LIBPKGTRANSACTION_SOURCE: dependencies/libpkgtransaction
          LIBPKGCHECK_SOURCE: dependencies/libpkgcheck
          LIBPKGEXEC_SOURCE: dependencies/libpkgexec
          MESON_BUILDTYPE: ${{ matrix.buildtype }}
        run: ./ci/configure-and-test.sh build ${{ matrix.mode }}

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC, cc: gcc, cxx: g++}
          - {name: Clang, cc: clang, cxx: clang++}
    name: ${{ matrix.name }} address,undefined
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgsource, ref: 9a2a85c85c20bbfa77306f3eb14ccc67ac1e800c, path: dependencies/libpkgsource}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgcatalog, ref: 16976cac176f576871e327d5d2f6fe9d9dfa0666, path: dependencies/libpkgcatalog}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgstate, ref: f74df278b47b48e798c3de01c922c59b58319d13, path: dependencies/libpkgstate}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgresolve, ref: master, path: dependencies/libpkgresolve}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild, ref: master, path: dependencies/libpkgbuild}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgtransaction, ref: master, path: dependencies/libpkgtransaction}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgcheck, ref: v0.2.0, path: dependencies/libpkgcheck}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgexec, ref: 08814baf2dbc037a037f29dd7de218e5a19c7e77, path: dependencies/libpkgexec}}
      - name: Verify qualified authority trees
        run: |
          test "$(git -C dependencies/libpkgresolve rev-parse 'HEAD^{tree}')" = 9e030b49606d5ac78bb1ee0c868681a37d0726cc
          test "$(git -C dependencies/libpkgbuild rev-parse 'HEAD^{tree}')" = 91b5326081cb5485ecaa3bcfb48829d34e653f10
          test "$(git -C dependencies/libpkgtransaction rev-parse 'HEAD^{tree}')" = 32f84467066fd2a6117c70b4907c67fbc04c6988
          test "$(git -C dependencies/libpkgcheck rev-parse 'HEAD^{tree}')" = da15d6d025f074ecc5ce14bdda228a3d32e0f49a
          test "$(git -C dependencies/libpkgexec rev-parse 'HEAD^{tree}')" = 2a896dcd02ba8d1860eda29a1673ef03b0f2290f
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libssl-dev ninja-build pkg-config python3-venv scdoc
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.11.1'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: ASan and UBSan qualification
        env:
          LIBPKGSOURCE_SOURCE: dependencies/libpkgsource
          LIBPKGCATALOG_SOURCE: dependencies/libpkgcatalog
          LIBPKGSTATE_SOURCE: dependencies/libpkgstate
          LIBPKGRESOLVE_SOURCE: dependencies/libpkgresolve
          LIBPKGBUILD_SOURCE: dependencies/libpkgbuild
          LIBPKGTRANSACTION_SOURCE: dependencies/libpkgtransaction
          LIBPKGCHECK_SOURCE: dependencies/libpkgcheck
          LIBPKGEXEC_SOURCE: dependencies/libpkgexec
          MESON_BUILDTYPE: debug
          MESON_SANITIZE: address,undefined
        run: ./ci/configure-and-test.sh build-sanitize shared
